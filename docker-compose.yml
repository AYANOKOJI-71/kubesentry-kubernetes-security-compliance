services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4900:4900"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:4900/health').status == 200"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
