apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-payment-api
  namespace: payments
  labels:
    app: legacy-payment-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-payment-api
  template:
    metadata:
      labels:
        app: legacy-payment-api
    spec:
      hostNetwork: true
      serviceAccountName: default
      volumes:
        - name: host-var-log
          hostPath:
            path: /var/log
      containers:
        - name: payment-api
          image: registry.example.invalid/legacy/payment-api:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: host-var-log
              mountPath: /host-logs
        - name: proxy
          image: nginx
          securityContext: {}
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-payment-api
  namespace: payments
spec:
  type: ClusterIP
  selector:
    app: legacy-payment-api
  ports:
    - port: 8080
      targetPort: 8080
